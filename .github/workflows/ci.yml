name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt
      - name: Build DuckDB and check every SQL query runs
        run: |
          python -c "from src.data import build_duckdb; build_duckdb()"
          python -c "
          from pathlib import Path
          from src.data import run_sql_file
          for q in sorted(Path('sql').glob('0[1-9]_*.sql')):
              df = run_sql_file(q.stem); assert len(df), q
              print(q.stem, len(df), 'rows')
          "
      - name: Unit tests (+ app and scoring smoke tests on the committed model)
        run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the serving image
        run: docker build -t churn-scoring .
      - name: Batch scoring runs inside the image
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/out" churn-scoring \
            python -m src.score --input data/raw/BankChurners.csv --output /out/scored.csv
          test "$(wc -l < out/scored.csv)" -gt 10000
      - name: Dashboard renders without errors inside the image
        run: |
          docker run --rm churn-scoring python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app/streamlit_app.py', default_timeout=180).run()
          assert not at.exception, at.exception
          assert 'Churn probability' in [m.label for m in at.metric]
          "
      - name: Dashboard server starts and passes its health check
        run: |
          docker run -d --name app -p 8501:8501 churn-scoring
          for i in $(seq 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
